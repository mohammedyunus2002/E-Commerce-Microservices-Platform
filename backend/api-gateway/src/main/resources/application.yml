server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    # Static instance lists feed Spring Cloud LoadBalancer, which round-robins across them.
    # In Kubernetes each entry is a Service DNS name, and kube-proxy spreads load across pods.
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: ${AUTH_SERVICE_URI:http://localhost:8081}
            product-service:
              - uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
            inventory-service:
              - uri: ${INVENTORY_SERVICE_URI:http://localhost:8083}
            order-service:
              - uri: ${ORDER_SERVICE_URI:http://localhost:8084}
            payment-service:
              - uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
            notification-service:
              - uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8086}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
          default-filters:
            - DedupeResponseHeader=X-Correlation-Id Access-Control-Allow-Origin, RETAIN_FIRST
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/admin/users/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/admin/products/**,/api/admin/categories/**
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**,/api/admin/inventory/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**,/api/cart/**,/api/admin/orders/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**,/api/admin/payments/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**,/api/admin/notifications/**

gateway:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:ecommerce-auth-service}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true
