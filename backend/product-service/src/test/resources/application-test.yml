spring:
  datasource:
    # One database per Spring test context, so cached contexts never see each other's rows.
    url: jdbc:h2:mem:product_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  # Most tests exercise the database path; ProductCacheIntegrationTest switches Redis on.
  cache:
    type: none

security:
  jwt:
    secret: test-only-signing-key-0123456789-abcdef
    issuer: ecommerce-auth-service
