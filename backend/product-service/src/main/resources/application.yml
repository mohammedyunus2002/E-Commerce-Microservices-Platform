server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: product-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: product-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      # Feeds the cache_gets_total{result=hit|miss} metrics used for the hit-ratio dashboard.
      enable-statistics: true
  data:
    redis:
      # Redis is used only through Spring Cache, not as a Spring Data repository store.
      repositories:
        enabled: false
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

app:
  cache:
    product-ttl: ${PRODUCT_CACHE_TTL:10m}
    category-ttl: ${CATEGORY_CACHE_TTL:30m}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ecommerce-auth-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  # Set API_DOCS_ENABLED=false in production to hide the API description and Swagger UI.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
